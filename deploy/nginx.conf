# Disbigle behind nginx. Replace example.org and the paths, then:
#   sudo cp nginx.conf /etc/nginx/sites-available/disbigle && sudo ln -s ../sites-available/disbigle /etc/nginx/sites-enabled/
# TLS certificates: certbot --nginx -d example.org

map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

# Requests that want ActivityPub JSON go to the API even on profile/post URLs.
map $http_accept $wants_activitypub {
  default 0;
  ~*application/activity\+json 1;
  ~*application/ld\+json 1;
}

upstream disbigle_api {
  server 127.0.0.1:3000;
  keepalive 32;
}

server {
  listen 80;
  listen [::]:80;
  server_name example.org;
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;
  server_name example.org;

  ssl_certificate     /etc/letsencrypt/live/example.org/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/example.org/privkey.pem;

  client_max_body_size 48m;
  add_header Strict-Transport-Security "max-age=31536000" always;

  # Built web client (pnpm --filter @disbigle/web build).
  root /opt/disbigle/apps/web/dist;

  # Uploaded media, served directly from disk.
  location /media/ {
    alias /var/lib/disbigle/media/;
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-Content-Type-Options nosniff;
  }

  # After migrating a diaspora* pod in place: other pods keep linking to the old photo URLs.
  location /uploads/images/ {
    alias /opt/diaspora/public/uploads/images/;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # API, streaming, federation endpoints of both protocols, and old diaspora* URLs (/u, /people, /posts).
  location ~ ^/(api|oauth|health|\.well-known|nodeinfo|users|inbox|receive|hcard|fetch|u|people|posts)(/|$) {
    proxy_pass http://disbigle_api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 3600s;
  }

  # Everything else is the single-page app, except ActivityPub clients asking for JSON.
  location / {
    if ($wants_activitypub) {
      proxy_pass http://disbigle_api;
    }
    try_files $uri /index.html;
  }

  # The service worker and manifest must be revalidated so updates reach installed apps.
  location ~ ^/(sw\.js|manifest\.webmanifest)$ {
    add_header Cache-Control "no-cache";
    try_files $uri =404;
  }

  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }
}
