name: Issue labels

# Issues opened with the forms get the label of the platform chosen in "Where?", so people who
# report bugs and ideas need no role on the repository. The body is only read as text.
on:
  issues:
    types: [opened, edited]

permissions:
  issues: write

jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const body = context.payload.issue.body || '';
            // The answer follows the "### Where? / ¿Dónde? / Dove?" heading of the form.
            const match = body.match(/###\s*Where\?[^\n]*\n+([\s\S]*?)(?:\n###|$)/);
            if (!match) return;
            const answer = match[1].toLowerCase();
            const labels = [];
            if (answer.includes('android')) labels.push('android');
            if (answer.includes('ios app')) labels.push('ios');
            if (answer.includes('web (app.disbigle.com)')) labels.push('web');
            if (answer.includes('federation')) labels.push('federation');
            if (answer.includes('emails')) labels.push('web');
            if (labels.length === 0) return;
            await github.rest.issues.addLabels({
              ...context.repo,
              issue_number: context.payload.issue.number,
              labels: [...new Set(labels)],
            });
