name: iOS

on:
  push:
    paths: ['apps/ios/**', '.github/workflows/ios.yml']
  pull_request:
    paths: ['apps/ios/**', '.github/workflows/ios.yml']
  workflow_dispatch:
    inputs:
      testflight:
        description: Sign and upload a build to TestFlight
        type: boolean
        default: false
      appstore:
        description: Upload the App Store listing (texts in apps/ios/fastlane/metadata and the screenshots)
        type: boolean
        default: false

jobs:
  build:
    runs-on: macos-15
    defaults:
      run:
        working-directory: apps/ios
    steps:
      - uses: actions/checkout@v4
      - name: Xcode version
        run: xcodebuild -version
      - name: Test DisbigleKit
        run: swift test --package-path DisbigleKit
      - name: Generate the Xcode project
        run: brew install xcodegen && xcodegen generate
      - name: Build for the simulator
        run: |
          set -o pipefail
          xcodebuild -project Disbigle.xcodeproj -scheme Disbigle -configuration Debug \
            -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build \
            | xcbeautify --renderer github-actions

  # The app against a seeded development server: screenshots of the main screens for the App Store.
  screenshots:
    needs: build
    runs-on: macos-15
    env:
      NODE_ENV: development
      PUBLIC_URL: http://localhost:3300
      LOCAL_DOMAIN: localhost:3300
      HOST: 127.0.0.1
      PORT: '3300'
      DATABASE_URL: postgres://disbigle@localhost:5432/disbigle_development
      REDIS_URL: redis://localhost:6379/0
      SESSION_SECRET: screenshots-screenshots-screenshots-screenshots-screenshots-0000
      REGISTRATION_MODE: open
      MEDIA_DIR: ${{ github.workspace }}/storage/media
    steps:
      - uses: actions/checkout@v4
      - name: PostgreSQL and Redis
        run: |
          brew install postgresql@17 redis >/dev/null
          PG=$(brew --prefix postgresql@17)/bin
          "$PG/initdb" -D "$RUNNER_TEMP/pg" -U disbigle --auth=trust >/dev/null
          "$PG/pg_ctl" -D "$RUNNER_TEMP/pg" -l "$RUNNER_TEMP/pg.log" -w start
          "$PG/createdb" -U disbigle disbigle_development
          redis-server --daemonize yes
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Development server with demo data
        run: |
          pnpm install --frozen-lockfile
          pnpm db:migrate
          pnpm --filter @disbigle/server seed-screenshots
          (cd apps/server && nohup npx tsx src/main.ts > "$RUNNER_TEMP/server.log" 2>&1 &)
          for i in $(seq 1 60); do curl -sf http://localhost:3300/health && break; sleep 1; done
          # One account per language, each with its own friends and posts.
          for who in it:giulia en:emma es:lucia; do
            echo "TOKEN_${who%%:*}=$(apps/ios/scripts/dev-token.sh http://localhost:3300 ${who#*:})" >> "$GITHUB_ENV"
          done
      - name: Build for the simulator
        working-directory: apps/ios
        run: |
          set -o pipefail
          brew install xcodegen >/dev/null && xcodegen generate
          xcodebuild -project Disbigle.xcodeproj -scheme Disbigle -configuration Debug \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath "$RUNNER_TEMP/dd" \
            CODE_SIGNING_ALLOWED=NO build | xcbeautify --renderer github-actions
      - name: Screenshots
        run: |
          # App Store sizes: iPhone 6.9" (1320x2868) and iPad 13" (2064x2752), in the listing's
          # languages, laid out as fastlane deliver reads them (fastlane/screenshots/<locale>/).
          udid() {
            xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next(x['udid'] for r in d.values() for x in r if x['name'].startswith(sys.argv[1])))" "$1"
          }
          shots=apps/ios/fastlane/screenshots
          for model in 'iPhone 16 Pro Max' 'iPad Pro 13-inch'; do
            device=$(udid "$model")
            tag=$(echo "$model" | cut -d' ' -f1)
            xcrun simctl boot "$device"
            xcrun simctl bootstatus "$device" -b
            xcrun simctl status_bar "$device" override --time 9:41 --batteryState charged --batteryLevel 100
            xcrun simctl install "$device" "$RUNNER_TEMP/dd/Build/Products/Debug-iphonesimulator/Disbigle.app"
            for locale in it en-US es-ES; do
              lang=${locale%%-*}
              case $lang in
                it) region=it_IT token=$TOKEN_it search=fotografia ;;
                en) region=en_US token=$TOKEN_en search=photo ;;
                es) region=es_ES token=$TOKEN_es search=fotos ;;
              esac
              mkdir -p "$shots/$locale"
              n=1
              for screen in home chat profile search notifications messages compose; do
                xcrun simctl terminate "$device" com.disbigle.app 2>/dev/null || true
                xcrun simctl launch "$device" com.disbigle.app -AppleLanguages "($lang)" -AppleLocale "$region" \
                  -DisbigleServer http://localhost:3300 -DisbigleToken "$token" -DisbigleScreen $screen \
                  -DisbigleSearch "$search"
                sleep 10
                xcrun simctl io "$device" screenshot "$shots/$locale/$n-$tag-$screen.png"
                n=$((n + 1))
              done
            done
            xcrun simctl shutdown "$device"
          done
          sips -g pixelWidth -g pixelHeight "$shots"/it/1-*.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: apps/ios/fastlane/screenshots
      - name: Server log
        if: failure()
        run: tail -50 "$RUNNER_TEMP/server.log"

  # An unsigned .ipa for SideStore/AltStore, which sign it with the person's own Apple ID.
  # From main it goes to the `ios-latest` release with a SideStore source:
  # https://github.com/faghy/disbigle/releases/download/ios-latest/sidestore.json
  sideload:
    needs: build
    runs-on: macos-15
    permissions:
      contents: write
    defaults:
      run:
        working-directory: apps/ios
    steps:
      - uses: actions/checkout@v4
      - name: Build the unsigned app
        run: |
          set -o pipefail
          brew install xcodegen >/dev/null && xcodegen generate
          xcodebuild -project Disbigle.xcodeproj -scheme Disbigle -configuration Release \
            -destination 'generic/platform=iOS' -derivedDataPath "$RUNNER_TEMP/dd" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} build \
            | xcbeautify --renderer github-actions
      - name: Package the .ipa
        run: |
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          cp -R "$RUNNER_TEMP/dd/Build/Products/Release-iphoneos/Disbigle.app" "$RUNNER_TEMP/ipa/Payload/"
          (cd "$RUNNER_TEMP/ipa" && zip -qry Disbigle.ipa Payload)
          mkdir -p dist && mv "$RUNNER_TEMP/ipa/Disbigle.ipa" dist/
      - name: SideStore source
        env:
          BUILD: ${{ github.run_number }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import datetime, json, os, plistlib
          info = plistlib.load(open(os.environ['RUNNER_TEMP'] + '/dd/Build/Products/Release-iphoneos/Disbigle.app/Info.plist', 'rb'))
          repo = os.environ['REPO']
          base = f'https://github.com/{repo}/releases/download/ios-latest'
          icon = f'https://raw.githubusercontent.com/{repo}/main/apps/ios/Disbigle/Resources/Assets.xcassets/AppIcon.appiconset/icon-1024.png'
          version = info['CFBundleShortVersionString']
          source = {
            'name': 'Disbigle',
            'subtitle': 'The Disbigle app for iOS',
            'description': 'Builds of the Disbigle iOS app, made from the main branch.',
            'iconURL': icon,
            'website': 'https://disbigle.com',
            'tintColor': '#cf3200',
            'nsfw': False,
            'apps': [{
              'name': 'Disbigle',
              'bundleIdentifier': info['CFBundleIdentifier'],
              'developerName': 'Disbigle',
              'subtitle': 'diaspora*, Mastodon and the fediverse in one app',
              'localizedDescription': 'Timelines, threads, notifications, messages, search and profiles of your Disbigle account; write, edit and delete posts with photos, polls and aspects.',
              'iconURL': icon,
              'tintColor': '#cf3200',
              'category': 'social',
              'versions': [{
                'version': version,
                'buildVersion': os.environ['BUILD'],
                'marketingVersion': f"{version} ({os.environ['BUILD']})",
                'date': datetime.datetime.now(datetime.timezone.utc).isoformat(timespec='seconds'),
                'downloadURL': f'{base}/Disbigle.ipa',
                'size': os.path.getsize('dist/Disbigle.ipa'),
                'localizedDescription': f"Build of commit {os.environ['SHA'][:7]}.",
                'minOSVersion': info.get('MinimumOSVersion', '17.0'),
              }],
              'appPermissions': {'entitlements': [], 'privacy': {}},
            }],
            'news': [],
          }
          json.dump(source, open('dist/sidestore.json', 'w'), indent=2)
          PY
          cat dist/sidestore.json
      - uses: actions/upload-artifact@v4
        with:
          name: ipa
          path: apps/ios/dist
      - name: Publish the ios-latest release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete ios-latest --yes --cleanup-tag || true
          gh release create ios-latest dist/Disbigle.ipa dist/sidestore.json \
            --prerelease --target "$GITHUB_SHA" --title "Disbigle iOS (latest build)" \
            --notes "Unsigned build of $(git rev-parse --short HEAD), for SideStore or AltStore. Add the source https://github.com/${{ github.repository }}/releases/download/ios-latest/sidestore.json or open Disbigle.ipa with SideStore."

  # Needs the repository secrets APP_STORE_CONNECT_KEY_ID, APP_STORE_CONNECT_ISSUER_ID,
  # APP_STORE_CONNECT_KEY (the .p8 file's content) and APPLE_TEAM_ID. Signing is automatic:
  # Xcode creates certificate and profile through the App Store Connect API key.
  testflight:
    if: github.event_name == 'workflow_dispatch' && inputs.testflight
    needs: build
    runs-on: macos-15
    defaults:
      run:
        working-directory: apps/ios
    env:
      DISBIGLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Xcode 26 (the App Store accepts only builds made with the iOS 26 SDK or later)
        run: |
          xcode=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | grep -v -i beta | sort -V | tail -1)
          [ -n "$xcode" ] || xcode=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$xcode" ]; then echo "No Xcode 26 on this runner:"; ls -d /Applications/Xcode*.app; exit 1; fi
          sudo xcode-select -s "$xcode/Contents/Developer"
          xcodebuild -version
      - name: App Store Connect key
        env:
          KEY: ${{ secrets.APP_STORE_CONNECT_KEY }}
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          printf '%s' "$KEY" > "$RUNNER_TEMP/keys/AuthKey.p8"
      - name: Generate the Xcode project
        run: brew install xcodegen && xcodegen generate
      - name: Archive
        run: |
          set -o pipefail
          xcodebuild -project Disbigle.xcodeproj -scheme Disbigle -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/Disbigle.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey.p8" \
            -authenticationKeyID "${{ secrets.APP_STORE_CONNECT_KEY_ID }}" \
            -authenticationKeyIssuerID "${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}" \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            archive | xcbeautify --renderer github-actions
      - name: Export the signed app
        run: |
          set -o pipefail
          # Same options, but write the .ipa here: the upload below gives Apple's own error messages.
          /usr/libexec/PlistBuddy -c "Set :destination export" ExportOptions.plist
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/Disbigle.xcarchive" \
            -exportOptionsPlist ExportOptions.plist -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey.p8" \
            -authenticationKeyID "${{ secrets.APP_STORE_CONNECT_KEY_ID }}" \
            -authenticationKeyIssuerID "${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}" \
            | xcbeautify --renderer github-actions
          ls -la "$RUNNER_TEMP/export"
      - name: Upload to TestFlight
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          # altool looks for the key as ~/private_keys/AuthKey_<id>.p8.
          mkdir -p ~/private_keys
          cp "$RUNNER_TEMP/keys/AuthKey.p8" ~/private_keys/AuthKey_$KEY_ID.p8
          xcrun altool --upload-app --type ios --file "$(ls "$RUNNER_TEMP"/export/*.ipa)" \
            --apiKey "$KEY_ID" --apiIssuer "$ISSUER_ID" --output-format normal
          rm -f ~/private_keys/AuthKey_$KEY_ID.p8
      - name: Remove the key
        if: always()
        run: rm -rf "$RUNNER_TEMP/keys"

  # The App Store listing: texts from apps/ios/fastlane/metadata and the screenshots above, sent
  # with fastlane deliver to the version in project.yml (created when missing). No build is sent
  # and nothing is submitted for review: that stays a choice made in App Store Connect.
  appstore:
    if: github.event_name == 'workflow_dispatch' && inputs.appstore
    needs: screenshots
    runs-on: macos-15
    defaults:
      run:
        working-directory: apps/ios
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: screenshots
          path: apps/ios/fastlane/screenshots
      - name: App Store Connect key
        env:
          KEY: ${{ secrets.APP_STORE_CONNECT_KEY }}
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          python3 -c "import json,os; print(json.dumps({'key_id': os.environ['KEY_ID'], 'issuer_id': os.environ['ISSUER_ID'], 'key': os.environ['KEY'], 'in_house': False}))" > "$RUNNER_TEMP/keys/api.json"
      - name: Upload the listing
        run: |
          version=$(grep -m1 'MARKETING_VERSION' project.yml | sed -E 's/.*: *"?([^"]+)"?/\1/')
          echo "Version $version"
          deliver() {
            fastlane deliver --api_key_path "$RUNNER_TEMP/keys/api.json" \
              --app_identifier com.disbigle.app --platform ios --app_version "$version" \
              --skip_binary_upload true --submit_for_review false \
              --run_precheck_before_submit false --force true "$@"
          }
          # Screenshots on their own first: the texts step ends by reading the review details,
          # which App Store Connect may not return yet for a first version ("No data").
          deliver --skip_metadata true --overwrite_screenshots true
          deliver --skip_screenshots true
      - name: Remove the key
        if: always()
        run: rm -rf "$RUNNER_TEMP/keys"
