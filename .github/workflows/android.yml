name: Android

on:
  push:
    paths: ['apps/android/**', '.github/workflows/android.yml']
  pull_request:
    paths: ['apps/android/**', '.github/workflows/android.yml']
  workflow_dispatch:

jobs:
  # The library against a seeded development server (sign-in, posts, media, settings), and the app build.
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: disbigle
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: disbigle_development
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10
      redis:
        image: redis:7
        ports: ['6379:6379']
    env:
      NODE_ENV: development
      PUBLIC_URL: http://localhost:3300
      LOCAL_DOMAIN: localhost:3300
      HOST: 127.0.0.1
      PORT: '3300'
      DATABASE_URL: postgres://disbigle@localhost:5432/disbigle_development
      REDIS_URL: redis://localhost:6379/0
      SESSION_SECRET: android-tests-android-tests-android-tests-android-tests-00000000
      REGISTRATION_MODE: open
      MEDIA_DIR: ${{ github.workspace }}/storage/media
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Development server with demo data
        run: |
          pnpm install --frozen-lockfile
          pnpm db:migrate
          pnpm --filter @disbigle/server seed
          (cd apps/server && nohup npx tsx src/main.ts > "$RUNNER_TEMP/server.log" 2>&1 &)
          for i in $(seq 1 60); do curl -sf http://localhost:3300/health && break; sleep 1; done
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Tests and debug build
        working-directory: apps/android
        env:
          DISBIGLE_TEST_SERVER: http://localhost:3300
        run: ./gradlew :kit:test :app:assembleDebug --console=plain
      - name: Server log
        if: failure()
        run: tail -100 "$RUNNER_TEMP/server.log"

  # From main, a signed APK goes to the `android-latest` release (install it, or follow it with
  # Obtainium: https://github.com/faghy/disbigle, pre-releases on, APK filter "Disbigle").
  # Needs the repository secrets ANDROID_KEYSTORE (the .jks, base64) and ANDROID_KEYSTORE_PASSWORD:
  # every update must be signed with the same key, or Android refuses to install it.
  release:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: apps/android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Signed release build
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
          DISBIGLE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE" ]; then echo "::error::ANDROID_KEYSTORE is not set"; exit 1; fi
          echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/release.jks"
          export DISBIGLE_KEYSTORE="$RUNNER_TEMP/release.jks"
          ./gradlew :app:assembleRelease -PversionCode=${{ github.run_number }} --console=plain
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/Disbigle.apk
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: apps/android/dist
      - name: Publish the android-latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete android-latest --yes --cleanup-tag || true
          gh release create android-latest dist/Disbigle.apk \
            --prerelease --target "$GITHUB_SHA" --title "Disbigle Android (latest build)" \
            --notes "Build ${{ github.run_number }} of $(git rev-parse --short HEAD). Download Disbigle.apk on the phone and open it (allow installing apps from the browser), or follow this repository with Obtainium to get updates."
