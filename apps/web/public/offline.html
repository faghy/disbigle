<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>Disbigle · Offline</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #fdf5ea;
        --fg: #2d1912;
        --muted: #6e5246;
        --accent: #cf3200;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #170e0b;
          --fg: #f6eee2;
          --muted: #c3ae9c;
          --accent: #ff8a5b;
        }
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        background: var(--bg);
        color: var(--fg);
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        text-align: center;
        padding: 1.5rem;
      }
      img {
        width: 72px;
        height: 72px;
        border-radius: 18px;
      }
      h1 {
        font-size: 1.4rem;
        margin: 1.25rem 0 0.5rem;
      }
      p {
        color: var(--muted);
        margin: 0.25rem 0;
      }
      a {
        display: inline-block;
        margin-top: 1.25rem;
        color: var(--accent);
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="" />
      <h1>You're offline · Sei offline</h1>
      <p>Disbigle will be back as soon as you are connected.</p>
      <p lang="it">Disbigle tornerà appena sarai di nuovo in linea.</p>
      <a href="/">Try again · Riprova</a>
    </main>
  </body>
</html>
