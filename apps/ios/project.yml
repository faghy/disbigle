# Xcode project for the Disbigle iOS app. Generate it with `xcodegen` (brew install xcodegen);
# the .xcodeproj is not kept in git.
name: Disbigle
options:
  bundleIdPrefix: com.disbigle
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "0.3.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    DEVELOPMENT_TEAM: ${DISBIGLE_TEAM_ID}
    CODE_SIGN_STYLE: Automatic
packages:
  DisbigleKit:
    path: DisbigleKit
targets:
  Disbigle:
    type: application
    platform: iOS
    sources:
      - Disbigle/Sources
      - Disbigle/Resources
    dependencies:
      - package: DisbigleKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.disbigle.app
        PRODUCT_NAME: Disbigle
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES
        SWIFT_EMIT_LOC_STRINGS: YES
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Disbigle
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.social-networking
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
    info:
      path: Disbigle/Info.plist
      properties:
        CFBundleLocalizations: [en, it, es]
        CFBundleDevelopmentRegion: en
        # Plain http only to this machine's network (a development server); https everywhere else.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        # Background App Refresh: looking for new notifications (no push service with SideStore).
        UIBackgroundModes: [fetch]
        BGTaskSchedulerPermittedIdentifiers: [com.disbigle.app.refresh]
schemes:
  Disbigle:
    build:
      targets:
        Disbigle: all
    test:
      targets: []
    run:
      config: Debug
    archive:
      config: Release
